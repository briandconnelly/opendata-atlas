name: Feature or portal request
description: A new capability, or a portal to curate.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What an agent should be able to do, in one or two sentences. For a portal, name its domain.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: The tool calls an agent makes now and where they fall short.
