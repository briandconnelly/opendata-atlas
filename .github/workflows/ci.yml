name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format)
        run: uv run ruff format --check

      - name: Type check (ty)
        run: uv run ty check

      - name: MCPB manifest in sync
        run: uv run python scripts/gen_manifest.py --check

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=opendata_atlas --cov-report=term

  # Build the wheel, sdist, and .mcpb, and smoke-test them on every OS (shared with release.yml).
  build:
    name: Build
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      cache: true

  # Flags dependency changes (uv.lock, workflow actions) that add known vulnerabilities.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # One stable required-check name for branch protection; the matrix names vary.
  ci-success:
    name: CI success
    needs: [test, build, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REVIEW_RESULT: ${{ needs.dependency-review.result }}
        # Dependency review runs only on pull requests, so a push to main skips it.
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ] \
            || { [ "$REVIEW_RESULT" != "success" ] && [ "$REVIEW_RESULT" != "skipped" ]; }; then
            echo "required jobs failed: test=$TEST_RESULT build=$BUILD_RESULT review=$REVIEW_RESULT"
            exit 1
          fi
