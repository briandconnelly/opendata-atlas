name: Build

# Build the wheel, sdist, and .mcpb bundle, then start the server from the wheel and the bundle on
# every desktop OS. Called by ci.yml on every PR and by release.yml before anything is published,
# so a release ships exactly what this workflow built and checked.

on:
  workflow_call:
    inputs:
      cache:
        description: "Use the uv cache (CI). Release builds pass false to build from scratch."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: ${{ inputs.cache }}
          prune-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build wheel and sdist
        run: uv build

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb@2.1.2 # pin for reproducible bundles

      - name: Build .mcpb bundle (allowlisted staging + archive check)
        run: uv run python scripts/build_bundle.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: ${{ inputs.cache }}
          prune-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (the smoke test's MCP client)
        run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Start the server from the wheel
        run: uv run python scripts/smoke_test.py --wheel dist/*.whl

      - name: Start the server from the sdist
        run: uv run python scripts/smoke_test.py --sdist dist/*.tar.gz

      - name: Start the server from the .mcpb bundle
        run: uv run python scripts/smoke_test.py --bundle dist/*.mcpb
