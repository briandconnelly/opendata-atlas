[[claim]]
id = "szww-y224-gangrelated-placeholders"
kind = "placeholder_share"
scope = {dataset = "szww-y224", column = "gangrelated"}
interpretation = {reliability = "unreliable", reason = "Blank on about 60% of cases (58% in 2025), with two vocabularies (YES / YES - BELIEVED TO BE GANG-RELATED, NO / NO - NOT BELIEVED TO BE GANG-RELATED) and two unknown values. A count of YES values is a floor, not the number of gang-related cases."}
placeholders = ["UNKNOWN", "UNKNOWN IF GANG-RELATED"]
reviewed_by = "claude"
reviewed_at = 2026-10-20

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT gangrelated AS v, count(*) AS n GROUP BY gangrelated ORDER BY n DESC LIMIT 101"
observed_at = 2026-10-20
observation = "Groups include shared-vocabulary placeholder values: \"UNKNOWN\" 1,690 of 170,501 rows (0.010). All 7 groups: null 101,929; NO - NOT BELIEVED TO BE GANG-RELATED 54,953; NO 8,126; UNKNOWN IF GANG-RELATED 3,067; UNKNOWN 1,690; YES - BELIEVED TO BE GANG-RELATED 691; YES 45."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT sum(case(gangrelated IS NULL, 1, true, 0)) AS nul, count(*) AS n"
observed_at = 2026-10-20
observation = "101,929 of 170,501 rows (0.598) are null. In 2025, 6,935 of 11,899 cases are null and 59 are YES - BELIEVED TO BE GANG-RELATED."

[[claim.assertion]]
checker = "value_present"
probe = 0
params = {column = "v", value = "UNKNOWN", count = "n"}

[[claim.assertion]]
checker = "share_by_group"
probe = 1
params = {numerator = "nul", denominator = "n", min = 0.4}

[[claim]]
id = "szww-y224-datetimereceived-timezone"
kind = "column_timezone"
scope = {dataset = "szww-y224", column = "datetimereceived"}

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(datetimereceived) AS h, count(*) AS n WHERE datetimereceived >= '2026-03-08T00:00:00' AND datetimereceived < '2026-03-09T00:00:00' GROUP BY h"
observed_at = 2026-10-20
observation = "On the spring-forward day probed, hour 2 has 0 rows; hours 1 and 3 have 1 and 0."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(datetimereceived) AS h, count(*) AS n WHERE datetimereceived >= '2025-10-18T00:00:00' AND datetimereceived < '2026-10-19T00:00:00' GROUP BY h"
observed_at = 2026-10-20
observation = "Rows peak at hour 10 (768 of 10,807); 24 of 24 hours populated."

[[claim.assertion]]
checker = "diurnal_peak"
probe = 1
params = {peak_from = 8, peak_to = 12}
