[[claim]]
id = "erm2-nwe9-council_district-place-field"
kind = "place_field"
scope = {dataset = "erm2-nwe9", column = "council_district"}
interpretation = {kind = "council_district", reliability = "ok", reason = "The council district NYC reports for the request, as two-digit text '01' to '51': filter with council_district = '01', since '1' matches no rows. 3,223,222 of 3,315,553 rows created in 2026 (0.972) are filled; September 2026, 0.977. The 2015 council layer (92fq-4b7q) disagrees with it on 14.7% of 2026 rows."}
reviewed_by = "claude"
reviewed_at = 2026-10-31

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT count(council_district) AS filled, count(*) AS n WHERE created_date between '2026-09-24T00:00:00' and '2026-09-30T23:59:59'"
observed_at = 2026-10-31
observation = "2026-09-24..30: 74,070 of 75,776 rows (0.977) have a value."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT council_district, count(*) AS n WHERE created_date between '2026-09-24T00:00:00' and '2026-09-30T23:59:59' AND council_district IN ('01', '1') GROUP BY council_district"
observed_at = 2026-10-31
observation = "2026-09-24..30: '01' matches 1,755 rows; '1' matches none. Over the whole table '01' matches 457,816."

[[claim.assertion]]
checker = "share_by_group"
probe = 0
params = {numerator = "filled", denominator = "n", min = 0.9}

[[claim.assertion]]
checker = "value_present"
probe = 1
params = {column = "council_district", value = "01", count = "n"}

[[claim.assertion]]
checker = "value_absent"
probe = 1
params = {column = "council_district", value = "1"}
