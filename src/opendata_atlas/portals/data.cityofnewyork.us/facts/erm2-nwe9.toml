[[claim]]
id = "erm2-nwe9-created_date-timezone"
kind = "column_timezone"
scope = {dataset = "erm2-nwe9", column = "created_date"}
interpretation = {timezone = "America/New_York", reason = "New York wall-clock time with no offset: requests peak in late morning (10:00 over the last year, 11:00 in September 2026) with all 24 hours populated, and on the 2026-03-08 spring-forward day the skipped 02:00 hour holds 1 row against 330 and 228 either side. Only 3,407 of 3,966,469 rows (0.001) in that year are at exactly 00:00:00, so midnight is not a default for an unknown time. The newest value, 2026-10-30T02:52:29, is not after the probe date."}
reviewed_by = "claude"
reviewed_at = 2026-10-31

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(created_date) AS h, count(*) AS n WHERE created_date >= '2026-03-08T00:00:00' AND created_date < '2026-03-09T00:00:00' GROUP BY h"
observed_at = 2026-10-31
observation = "On the spring-forward day probed, hour 2 has 1 rows; hours 1 and 3 have 330 and 228."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(created_date) AS h, count(*) AS n WHERE created_date >= '2026-09-24T00:00:00' AND created_date < '2026-10-01T00:00:00' GROUP BY h"
observed_at = 2026-10-31
observation = "2026-09-24..30: rows peak at hour 11 (4,911 of 75,776), with 818 at hour 3; 24 of 24 hours populated. September 2026 also peaks at hour 11 (19,835 of 323,632). Over 2025-10-30..2026-10-30 they peak at hour 10 (240,883 of 3,979,415), a query that times out under the drift run."

[[claim.assertion]]
checker = "diurnal_peak"
probe = 1
params = {peak_from = 8, peak_to = 12}

