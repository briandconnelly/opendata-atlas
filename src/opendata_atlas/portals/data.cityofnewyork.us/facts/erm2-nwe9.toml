[[claim]]
id = "erm2-nwe9-unit"
kind = "unit_of_observation"
scope = {dataset = "erm2-nwe9"}
interpretation = {unit = "service_request", reason = "One row per 311 service request directed to a city agency; `unique_key` was distinct on every row probed (September 2026: 323,632 rows, 323,632 keys), so count(*) counts requests. Requests from 2010-2019 are in a separate dataset, 76ig-c548."}
reviewed_by = "claude"
reviewed_at = 2026-10-31

[[claim.evidence]]
kind = "document"
url = "https://data.cityofnewyork.us/api/views/erm2-nwe9.json"
quote = "Each row of data contains information about the service request, including complaint type, responding agency, and geographic location."
observed_at = 2026-10-31

[[claim.evidence]]
kind = "document"
url = "https://data.cityofnewyork.us/api/views/erm2-nwe9.json"
quote = "For data from 2010-2019 see: https://data.cityofnewyork.us/Social-Services/311-Service-Requests-from-2010-to-2019/76ig-c548/about_data"
observed_at = 2026-10-31

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT count(*) AS n, count(distinct unique_key) AS keys WHERE created_date between '2026-09-24T00:00:00' and '2026-09-30T23:59:59'"
observed_at = 2026-10-31
observation = "2026-09-24..30: 75,776 rows and 75,776 distinct unique_key values. All of September 2026: 323,632 rows and 323,632 keys."

[[claim.assertion]]
checker = "share_by_group"
probe = 0
params = {numerator = "keys", denominator = "n", min = 0.99}

