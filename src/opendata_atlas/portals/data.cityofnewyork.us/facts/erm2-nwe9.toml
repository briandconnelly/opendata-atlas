observed_at = 2026-10-31
observation = "138,622 of 3,885,393 rows (0.036) in the window are at exactly 00:00:00, which may be a default for an unknown time."

[[claim.assertion]]
checker = "diurnal_peak"
probe = 1
params = {peak_from = 11, peak_to = 15}

