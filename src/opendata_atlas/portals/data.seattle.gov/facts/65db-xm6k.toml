[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(date) AS h, sum(fremont_bridge) AS n WHERE date >= '2026-03-08T00:00:00' AND date < '2026-03-09T00:00:00' AND fremont_bridge IS NOT NULL GROUP BY h"
observed_at = 2026-10-18
observation = "On 2026-03-08, the spring-forward date, the 02:00 row has no counts (all null), so no hour 2 group has a count; hours 1 and 3 count 26 and 20. The null-count filter keeps an empty hour from reading as unparseable; docs/evidence/drift-2026-10-18/fremont-reprobe.json"

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(date) AS h, sum(fremont_bridge) AS n WHERE date >= '2025-01-01T00:00:00' AND date < '2026-01-01T00:00:00' GROUP BY h"
observed_at = 2026-10-18
observation = "Counts peak at hour 8 (118,390) with a second peak at hour 17 (112,077) over 2025; all 24 hours populated; docs/evidence/drift-2026-10-18/seattle-probes.json"

