query = "SELECT sum(case(:@computed_region_8hcu_yrd4 = 3, 1, true, 0)) AS hit, count(*) AS n WHERE ward = 5 AND date >= '2024-01-01T00:00:00'"
observed_at = 2026-10-19
observation = "Of 16,854 rows since 2024 reporting ward 5, 16,406 (0.973) fall in feature 3 (ward 5)."

