# Crimes - 2001 to Present. Drafted by atlas-profile; reviewed 2026-10-19.
# Computed-region columns without a claim here take their layer's claim in regions.toml.

[[claim]]
id = "ijzp-q8t2-unit-reported-incident"
kind = "unit_of_observation"
scope = {dataset = "ijzp-q8t2"}
interpretation = {unit = "reported crime incident", reason = "One row per reported incident, except homicides, which have one row per victim; the most recent seven days are withheld."}
reviewed_by = "claude"
reviewed_at = 2026-10-19

[[claim.evidence]]
kind = "document"
url = "https://data.cityofchicago.org/d/ijzp-q8t2"
quote = "This dataset reflects reported incidents of crime (with the exception of murders where data exists for each victim) that occurred in the City of Chicago from 2001 to present, minus the most recent seven days."
observed_at = 2026-10-19

[[claim]]
id = "ijzp-q8t2-date-timezone"
kind = "column_timezone"
scope = {dataset = "ijzp-q8t2", column = "date"}
interpretation = {timezone = "America/Chicago", reason = "Local wall-clock time with no offset: no rows at 02:00 on the spring-forward day. The hour-0 peak is an artifact: over half its rows are stamped exactly 00:00, a default for an unknown time; otherwise counts peak 12:00-18:00."}
reviewed_by = "claude"
reviewed_at = 2026-10-19

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(date) AS h, count(*) AS n WHERE date >= '2026-03-08T00:00:00' AND date < '2026-03-09T00:00:00' GROUP BY h"
observed_at = 2026-10-19
observation = "On the spring-forward day probed, hour 2 has 0 rows; hours 1 and 3 have 17 and 28."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(date) AS h, count(*) AS n WHERE date >= '2025-10-11T00:00:00' AND date < '2026-10-12T00:00:00' GROUP BY h"
observed_at = 2026-10-19
observation = "Rows peak at hour 0 (15,415 of 231,496); 24 of 24 hours populated. Hours 12-18 hold 12,273-12,882 each; hours 4-6 the fewest (4,487-5,275)."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT sum(case(date_extract_mm(date) = 0, 1, true, 0)) AS on_hour, count(*) AS n WHERE date_extract_hh(date) = 0 AND date >= '2025-10-11T00:00:00' AND date < '2026-10-12T00:00:00'"
observed_at = 2026-10-19
observation = "8,333 of the 15,415 hour-0 rows (0.54) are at minute 0."

[[claim.assertion]]
checker = "dst_gap"
probe = 0
params = {gap_hour = 2}

[[claim.assertion]]
checker = "diurnal_peak"
probe = 1
params = {peak_from = 0, peak_to = 2}

[[claim]]
id = "ijzp-q8t2-ward-place-field"
kind = "place_field"
scope = {dataset = "ijzp-q8t2", column = "ward"}
interpretation = {kind = "ward", reliability = "partial", reason = "The ward recorded with the report. Almost empty for 2001 (under 1% of rows) and 73% filled for 2002; over 99.9% filled since 2003. For counts by ward that include 2001-2002, use :@computed_region_8hcu_yrd4 (current wards) instead."}
reviewed_by = "claude"
reviewed_at = 2026-10-19

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT count(ward) AS w, count(*) AS n WHERE year = 2001"
observed_at = 2026-10-19
observation = "4,416 of 485,979 rows from 2001 (0.009) have a ward. A per-year probe (GROUP BY year) gave 2002: 353,758 of 486,843 (0.73); every year 2003-2026 at least 0.999."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT count(ward) AS w, count(*) AS n WHERE year = 2025"
observed_at = 2026-10-19
observation = "238,157 of 238,158 rows from 2025 have a ward."

[[claim.assertion]]
checker = "share_by_group"
probe = 0
params = {numerator = "w", denominator = "n", max = 0.05}

[[claim.assertion]]
checker = "share_by_group"
probe = 1
params = {numerator = "w", denominator = "n", min = 0.99}

