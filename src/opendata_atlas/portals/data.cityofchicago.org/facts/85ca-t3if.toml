[[claim]]
id = "85ca-t3if-crash_date-timezone"
kind = "column_timezone"
scope = {dataset = "85ca-t3if", column = "crash_date"}

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(crash_date) AS h, count(*) AS n WHERE crash_date >= '2026-03-08T00:00:00' AND crash_date < '2026-03-09T00:00:00' GROUP BY h"
observed_at = 2026-10-19
observation = "On the spring-forward day probed, hour 2 has 0 rows; hours 1 and 3 have 10 and 18."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(crash_date) AS h, count(*) AS n WHERE crash_date >= '2025-10-18T00:00:00' AND crash_date < '2026-10-19T00:00:00' GROUP BY h"
observed_at = 2026-10-19
observation = "Rows peak at hour 15 (8,805 of 110,364); 24 of 24 hours populated."

[[claim.assertion]]
checker = "dst_gap"
probe = 0
params = {gap_hour = 2}

[[claim.assertion]]
checker = "diurnal_peak"
probe = 1
params = {peak_from = 13, peak_to = 17}

