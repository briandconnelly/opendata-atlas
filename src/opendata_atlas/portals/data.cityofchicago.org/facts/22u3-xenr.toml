scope = {dataset = "22u3-xenr", column = "violation_last_modified_date"}

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(violation_last_modified_date) AS h, count(*) AS n WHERE violation_last_modified_date >= '2026-03-08T00:00:00' AND violation_last_modified_date < '2026-03-09T00:00:00' GROUP BY h"
observed_at = 2026-10-19
observation = "On the spring-forward day probed, hour 2 has 0 rows; hours 1 and 3 have 0 and 0."

[[claim.evidence]]
kind = "soql_probe"
query = "SELECT date_extract_hh(violation_last_modified_date) AS h, count(*) AS n WHERE violation_last_modified_date >= '2025-10-18T00:00:00' AND violation_last_modified_date < '2026-10-19T00:00:00' GROUP BY h"
observed_at = 2026-10-19
observation = "Rows peak at hour 14 (10,423 of 82,605); 22 of 24 hours populated."

[[claim.assertion]]
