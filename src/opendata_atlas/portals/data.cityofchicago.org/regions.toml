# Computed-region layers seen on Chicago datasets (portal-level: any dataset may use them).
# Layer names, update dates and label columns probed 2026-10-19 from /api/views/<layer>.json
# and the layers' own rows. A dataset's place_field claim on a column overrides these.

[[claim]]
id = "region-8hcu-yrd4"
kind = "region_layer"
scope = {layer = "8hcu-yrd4"}
interpretation = {kind = "ward", label_column = "ward", vintage = "Wards 2023-, updated 2023-08-18 (50 wards, in force from May 2023)", reliability = "ok", reason = "Current ward boundaries; a row from before May 2023 gets the ward that covers its location today, not the ward at the time."}
reviewed_by = "claude"
reviewed_at = 2026-10-19

[[claim.evidence]]
kind = "metadata_probe"
path = "/api/views/8hcu-yrd4.json"
observed_at = 2026-10-19
observation = "name \"Wards 2023-\"; rowsUpdatedAt 2023-08-18; description: \"Ward boundaries in Chicago from May 2023 onward\". 50 features, `ward` 1-50; `_feature_id` is not the ward number (feature 3 is ward 5)."

[[claim.assertion]]
checker = "metadata_equals"
probe = 0
params = {field = "name", value = "Wards 2023-"}

[[claim]]
id = "region-43wa-7qmu"
kind = "region_layer"
scope = {layer = "43wa-7qmu"}
interpretation = {kind = "ward", label_column = "ward", vintage = "Wards 2015-2023, updated 2015-04-22 (50 wards)", reliability = "partial", reason = "Ward boundaries in force May 2015 to May 2023; superseded by layer 8hcu-yrd4 for current wards."}
reviewed_by = "claude"
reviewed_at = 2026-10-19

[[claim.evidence]]
kind = "metadata_probe"
path = "/api/views/43wa-7qmu.json"
observed_at = 2026-10-19
observation = "name \"Wards\"; rowsUpdatedAt 2015-04-22. 50 features, `ward` 1-50; `_feature_id` is not the ward number (feature 1 is ward 12)."

[[claim.assertion]]
checker = "metadata_before"
probe = 0
params = {field = "rowsUpdatedAt", before = 2023-01-01}

