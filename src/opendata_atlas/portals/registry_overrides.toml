# Hand-written registry overrides (docs/design.md, Registry steps 4-5).
#
# Allowed fields: name, aliases, place_names, jurisdiction, timezone, public_host, catalog_query,
# status. An id the enumeration did not produce becomes a manual entry and must pass eligibility
# and identity when scripts/build_registry.py runs.
#
# Sources: `name` and `place_names` come only from the portal's own title, recorded in
# docs/evidence/registry-2026-10-18/titles.json (site_theme `strings.site_title` and
# `strings.company` from /api/configurations.json?type=site_theme, and the home page <title>);
# each comment below quotes them. A generated name rejected on review is overridden with the
# host; a renamed one, with another part of the same portal's title. `jurisdiction` follows
# from that name; where the title does not say city or county the level is "other".
# `jurisdiction.region` is the ISO 3166-2 subdivision code without the country prefix.
# `timezone` is a calendar assignment for a single-zone jurisdiction, not an upstream fact
# (docs/decisions.md); it is omitted (null) for multi-zone states, national and supranational
# portals, and portals without a jurisdiction.
#
# Coverage:
# - 1-51: the 50 largest portals by catalog_size on 2026-10-18, after the eligibility rules
#   (summary.json `top50_by_catalog_size`), which include the required Cook County. 16 was
#   Chicago, now defined by its pack; 51, data.nj.gov, joined the 50 in its place (milestone 6).
#   37 was Los Angeles, now defined by its pack.
# - 52-57: generated names that the milestone 6 review rejected or renamed
#   (docs/evidence/registry-names-2026-10-20/review.md); they set `name` only.
# - 58-59: Everett and King County, added for curation (milestone 6). Both are now defined by
#   their packs, so neither entry remains.
# data.seattle.gov, data.cityofchicago.org, data.everettwa.gov, data.kingcounty.gov and
# data.lacity.org are defined by their packs (portal.toml) and have no override.
#
# Aliases: give them only to portals being curated or profiled. So far: Chicago (milestone 2),
# Everett and King County (milestone 6), and Los Angeles, each now in its pack.

# 1. titles.json["datahub.hhs.gov"]: site_title="Tyler Data & Insights", site_company="HHS Data Hub", html_title="HHS Data Hub"
# national portal: no timezone
# source: country US: HHS is a United States department; geography (the named place lies there), not the title
["datahub.hhs.gov"]
name = "HHS Data Hub"
jurisdiction = { level = "national", country = "US" }

